services:
  valkey:
    image: valkey/valkey:8-alpine
    container_name: wrs-valkey
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["valkey-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./WRS.Server
      dockerfile: WRS.Server/Dockerfile
    container_name: wrs-server
    restart: unless-stopped
    depends_on:
      valkey:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      Valkey__Configuration: valkey:6379
    ports:
      - "5145:8080"

volumes:
  valkey-data:
